[package]
name = "ntfy-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Lightweight tray app bridging ntfy servers to native OS notifications"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
httpdate = "1.0.3"
humantime = "2.4.0"
keyring-core = "1.0.1"
lexopt = "0.3.2"
open = "5.4.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
axum = "0.8.9"
filetime = "0.2.29"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["net", "rt", "macros", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
